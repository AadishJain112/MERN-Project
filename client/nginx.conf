# ============================================
# Nginx Configuration for CD-STAR Frontend
# ============================================
# This file tells Nginx how to serve your React app
# and forward API requests to the backend

server {
    # Listen on port 80 (standard HTTP port)
    listen 80;
    
    # Server name (you can change this)
    server_name localhost;
    
    # Root directory where React build files are located
    root /usr/share/nginx/html;
    
    # Default files to serve
    index index.html;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # ============================================
    # API Proxy Configuration
    # ============================================
    # All requests starting with /api are forwarded to the backend
    location /api {
        # Proxy to backend container (docker-compose service name)
        proxy_pass http://backend:5000;
        
        # Forward original host and IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # ============================================
    # Uploads Proxy Configuration
    # ============================================
    # Serve uploaded files from backend
    location /uploads {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
    
    # ============================================
    # React Router Configuration
    # ============================================
    # For React Router to work, all routes should serve index.html
    # This allows client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets (images, CSS, JS) for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

